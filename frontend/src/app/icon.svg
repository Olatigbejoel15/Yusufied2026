<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep olive rounded tile (same colour as the site's text and buttons) -->
  <rect width="64" height="64" rx="14" fill="#353a22" />
  <!-- Thin champagne border inside the tile for a framed look -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#b3924f" stroke-opacity="0.55" stroke-width="1.5" />
  <!-- The Y: two arms meeting, then a stem. Round ends keep it soft and elegant -->
  <path d="M18 14 L32 34 L46 14 M32 34 L32 52" fill="none" stroke="#b3924f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Small ring sitting between the arms of the Y -->
  <circle cx="32" cy="17" r="4.5" fill="none" stroke="#b3924f" stroke-width="2.5" />
</svg>